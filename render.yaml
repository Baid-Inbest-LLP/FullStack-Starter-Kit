# Render Blueprint — FullStack Starter Kit (pnpm monorepo)
#
# Before deploy:
# 1. Set MONGODB_URI on fullstack-starter-kit-server (Render Dashboard → Environment).
# 2. In MongoDB Atlas → Network Access, allow 0.0.0.0/0 (or Render egress IPs).
# 3. After first deploy, set FRONTEND_URL on fullstack-starter-kit-server and VITE_API_URL on
#    fullstack-starter-kit-client to the actual onrender.com URLs Render assigns.

services:
  - type: web
    name: fullstack-starter-kit-server
    runtime: node
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter server start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://fullstack-starter-kit-client.onrender.com

  - type: web
    name: fullstack-starter-kit-client
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: pnpm --filter client build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fullstack-starter-kit-server.onrender.com/api/v1
